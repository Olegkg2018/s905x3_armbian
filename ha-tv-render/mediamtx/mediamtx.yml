rtspAddress: :8554
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
moq: no
api: no
metrics: no
pprof: no
playback: no
logLevel: info

authMethod: internal
authInternalUsers:
  - user: any
    ips: ['127.0.0.1', '::1', '172.16.0.0/12']
    permissions:
      - action: publish
      - action: read
  - user: any
    ips: ['192.168.2.0/24']
    permissions:
      - action: read
  - user: admin
    pass: CHANGE_ME
    permissions:
      - action: read

paths:
  tv:
    source: publisher
