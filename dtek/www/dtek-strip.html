<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<style>html{color-scheme:dark;background:#111a33}body{margin:0;padding:18px 16px;color:#a9b3d6;font:13px system-ui,sans-serif;background:linear-gradient(145deg,#16213f,#101831 55%,#161233)}</style></head>
<body>загрузка ленты ДТЭК…
<script>
/* Загрузчик: сам не меняется (его можно кешировать), а актуальную страницу ленты каждый раз берёт без кеша.
   Так правки dtek-schedule.html видны сразу, без смены адреса и перезапуска HA. */
fetch("/local/dtek-schedule.html?ts=" + Date.now(), {cache: "no-store"})
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(function (t) { document.open(); document.write(t); document.close(); })
  .catch(function (e) { document.body.textContent = "Не удалось загрузить ленту ДТЭК: " + e.message; });
</script></body></html>
