<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ru">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>TV panel</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#283040;
    --fg:#e6edf3; --dim:#8b949e;
    --grid:#3fb950; --pv:#f2cc0c; --batt-in:#3fb950; --batt-out:#e3792b;
    --load:#58a6ff; --hot:#e3792b; --cold:#58a6ff; --on:#3fb950; --off:#6e7681;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Noto Sans","DejaVu Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;padding:18px 22px;gap:14px}

  /* header */
  .top{display:flex;align-items:flex-start;justify-content:space-between}
  .tl{display:flex;align-items:baseline;gap:20px}
  .clock{font-weight:700;font-size:110px;line-height:.9;letter-spacing:-2px}
  .date{font-size:64px;color:var(--dim);text-transform:capitalize;white-space:nowrap}
  .now{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
  .now .row{display:flex;align-items:center;gap:14px}
  .now .t{font-size:76px;font-weight:600;line-height:1}
  .now .ico{font-size:52px;line-height:1}
  .now .c{font-size:21px;color:var(--dim);margin-top:2px}
  .now .sub{font-size:18px;color:var(--dim);margin-top:2px}

  /* график отключений на день: 48 получасовых ячеек, засечки каждые 3 ч, маркер «сейчас» */
  .sched{position:relative;height:52px;flex:0 0 auto;margin:-6px 0}
  .sched .st{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--dim);line-height:16px;white-space:nowrap}
  .sched .st .out{color:#f85149} .sched .st .ok{color:var(--on)}
  .sbar{position:relative;display:flex;gap:2px;height:30px;margin-top:3px}
  .sbar i{flex:1;display:block;background:var(--on)}
  .sbar i.c1{background:#f85149} .sbar i.c2{background:var(--pv)} .sbar i.past{opacity:.45}
  .sbar.off i{background:var(--panel2);opacity:1}
  .sbar .now{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--fg)}
  .sbar .now::before{content:"";position:absolute;top:-4px;left:-4px;border:5px solid transparent;border-top:6px solid var(--fg);border-bottom:0}
  /* время начала участков: крупные белые цифры внутри ячеек, идут через соседние ячейки */
  .sbar .tl{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:5px;font-size:22px;font-weight:700;
    color:var(--fg);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 3px var(--bg),0 0 4px var(--bg)}

  /* forecast - grows to fill the top half */
  .fc{margin-bottom:12px;flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:12px}
  .fc .d{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:6px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .fc .dw{font-size:26px;line-height:1.1;font-weight:600;color:var(--fg);text-transform:capitalize}
  .fc .di{font-size:44px;line-height:1}
  .fc .dt{font-size:25px;font-weight:600}
  .fc .dt small{color:var(--dim);font-weight:400;font-size:20px}

  /* sensor grid - fixed ~half-page height */
  .grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(2,158px);gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .card .lbl{font-size:18px;color:var(--dim);line-height:1.15}
  .card .ico{width:52px;height:52px;display:block;opacity:.92}
  .card .ico svg{width:100%;height:100%;display:block}
  .card .body{align-self:flex-end;text-align:right;width:100%}
  .card .val{font-size:56px;font-weight:800;line-height:1;white-space:nowrap}
  .card .val small{font-size:24px;font-weight:500;color:var(--dim)}
  .card .note{font-size:15px;color:var(--dim);margin-top:2px}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--load)}
  .bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;border-radius:5px}
  .big{font-size:58px}
  .pill{display:inline-block;font-size:40px;font-weight:700;padding:3px 18px;border-radius:10px}
  .stale{opacity:.35}
  /* воздушная тревога: слово после даты, цвет по уровню (красный/жёлтый) */
  .alarm{font-size:56px;font-weight:800;letter-spacing:1px;white-space:nowrap}
  .alarm.red{color:#f85149}
  .alarm.yellow{color:#f2cc0c}
  /* отключение света: тонкая красная рамка вокруг плиток с разрывом под подпись «пропал/включение» */
  .gridwrap{position:relative;flex:0 0 auto}
  .outline{display:none;position:absolute;inset:-8px;border:2px solid #f85149;border-radius:16px;pointer-events:none}
  .gridwrap.outage .outline{display:block}
  /* фон подписи — узкая полоса только по линии рамки (разрыв), чтобы не закрывать края плиток под ней */
  .outline span{position:absolute;top:-17px;left:26px;padding:0 16px;color:#f85149;
    background:linear-gradient(to bottom,transparent 0,transparent 5px,var(--bg) 5px,var(--bg) 22px,transparent 22px);
    font-size:28px;font-weight:700;line-height:32px;letter-spacing:.5px;white-space:nowrap}
  #err{position:absolute;left:8px;bottom:6px;font-size:13px;color:#f85149}
</style>
</head>
<body>
  <div class="top">
    <div class="tl">
      <span class="clock" id="clock">--:--</span>
      <span class="date" id="date">&mdash;</span>
      <span class="alarm" id="alarm"></span>
    </div>
    <div class="now">
      <div class="row"><span class="ico" id="w-ico">&middot;</span><span class="t" id="w-temp">&mdash;</span></div>
      <div class="c" id="w-cond">&mdash;</div>
      <div class="sub" id="w-sub"></div>
    </div>
  </div>

  <div class="sched" id="sched">
    <div class="st"><span id="schedTitle"></span><span id="schedTotal"></span></div>
    <div class="sbar off" id="schedBar"></div>
  </div>
  <div class="fc" id="fc"></div>

  <div class="gridwrap" id="gridwrap">
    <div class="grid" id="grid"></div>
    <div class="outline"><span id="outlineText"></span></div>
  </div>
  <div id="err"></div>

<script>
"use strict";
const WEATHER = "weather.krivoi_rog";   // Gismeteo, "Кривой Рог"
let fcData = [], fcAt = 0;               // cached 5-day forecast
const RU_DOW_S = ["вс","пн","вт","ср","чт","пт","сб"];
const WICON = {
  "sunny":"☀️","clear-night":"🌙","partlycloudy":"⛅","cloudy":"☁️","fog":"🌫️",
  "rainy":"🌧️","pouring":"🌧️","lightning":"🌩️","lightning-rainy":"⛈️",
  "snowy":"🌨️","snowy-rainy":"🌨️","hail":"🌨️","windy":"🌬️","windy-variant":"🌬️","exceptional":"⚠️"
};
const WNAME = {
  "sunny":"ясно","clear-night":"ясно","partlycloudy":"переменная облачность","cloudy":"пасмурно",
  "fog":"туман","rainy":"дождь","pouring":"ливень","lightning":"гроза","lightning-rainy":"гроза, дождь",
  "snowy":"снег","snowy-rainy":"дождь со снегом","hail":"град","windy":"ветрено","exceptional":"опасно"
};

const p2 = (n)=>String(n).padStart(2,"0");
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent = p2(d.getHours())+":"+p2(d.getMinutes());
  document.getElementById("date").textContent =
    RU_DOW_S[d.getDay()]+" "+p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+String(d.getFullYear()).slice(-2);
}
setInterval(tick, 10000); tick();

function token(){
  try{ return JSON.parse(localStorage.getItem("hassTokens")).access_token; }catch(e){ return null; }
}
async function api(path, opts){
  const t = token();
  if(!t) throw new Error("no token yet");
  opts = opts || {};
  opts.headers = Object.assign({Authorization:"Bearer "+t}, opts.headers||{});
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error(path+" "+r.status);
  return r.json();
}
// Свет отключён, если реальное напряжение сети ниже порога. Нет данных (unavailable/unknown/пусто)
// -> НЕ тревожим: рамка только по достоверному значению.
const GRID_VOLT = "sensor.realnoe_napriazhenie_seti", OUTAGE_BELOW_V = 100;
function isOutage(state){
  if(state===null || state===undefined || String(state).trim()==="") return false;
  const v = Number(state);
  return Number.isFinite(v) && v < OUTAGE_BELOW_V;
}
// Воздушная тревога: run.py раз в минуту кладёт {lvl:"red"|"yellow"|"", ts} в localStorage.alertState
// (данные siren.pp.ua; из страницы напрямую нельзя — нет CORS). Старше 5 минут — считаем неизвестным.
const ALERT_STALE_MS = 300000;
function alertLevelFrom(raw, nowMs){
  try{
    const o = JSON.parse(raw);
    if(!o || (o.lvl!=="red" && o.lvl!=="yellow")) return "";
    const age = nowMs - Number(o.ts);
    return (age>=0 && age<=ALERT_STALE_MS) ? o.lvl : "";
  }catch(e){ return ""; }
}
function showAlert(){
  let raw = null; try{ raw = localStorage.getItem("alertState"); }catch(e){}
  const lvl = alertLevelFrom(raw, Date.now());
  const al = document.getElementById("alarm");
  al.className = "alarm" + (lvl ? " "+lvl : "");
  al.textContent = lvl ? "ТРЕВОГА" : "";
}
setInterval(showAlert, 5000); showAlert();
// ---- отключение света: когда пропал и когда включат (ДТЕК, запасной источник — график YASNO) ----
const YASNO_NEXT_CONN = "sensor.yasno_dnipro_dnem_2_2_next_connectivity";   // «плановое вкл»
const YASNO_NEXT_OUT  = "sensor.yasno_dnipro_dnem_2_2_next_planned_outage";  // «плановое откл»
const YASNO_STATUS    = "sensor.yasno_dnipro_dnem_2_2_status_today";             // emergency_shutdowns = график не действует
// Интеграция ha-dtek (данные портала ДТЕК по адресу/кабинету). В id сущностей есть номер счёта, поэтому ищем по шаблону.
const DTEK_RESTORE_RE = /^sensor\.dtek(_account_\d+)?_restore_time$/;
const DTEK_ACTIVE_RE  = /^binary_sensor\.dtek(_account_\d+)?_outage_active$/;
const DTEK_CAL_RE     = /^calendar\.dtek(_account_\d+)?_outage_schedule$/;
const HIST_HOURS = 72, HIST_EVERY_MS = 300000, HIST_RETRY_MS = 30000;
// Начало текущего отключения: время первой точки в последней непрерывной серии значений < порога.
// Нечисловые точки (unavailable) серию не рвут. Если серия тянется до начала окна — начало неизвестно (null).
function outageStartFrom(points, below){
  let start = null, closed = false;
  for(let i=points.length-1; i>=0; i--){
    const v = parseFloat(points[i].state);
    if(isNaN(v)) continue;
    if(v < below){ start = Date.parse(points[i].last_changed || points[i].last_updated); }
    else { closed = true; break; }
  }
  return (closed && Number.isFinite(start)) ? start : null;
}
function findEntity(S, re){ for(const id in S){ if(re.test(id)) return S[id]; } return null; }
const okState = (s)=> !!s && s.state!==undefined && s.state!==null && !["unavailable","unknown",""].includes(s.state);
// Время включения по ДТЕК: сенсор restore_time (в будущем), если сам ДТЕК не считает, что отключения нет.
function dtekRestore(S, nowMs){
  const r = findEntity(S, DTEK_RESTORE_RE), a = findEntity(S, DTEK_ACTIVE_RE);
  if(!okState(r)) return null;
  if(a && a.state==="off") return null;
  const t = Date.parse(r.state);
  return (Number.isFinite(t) && t > nowMs) ? t : null;
}
// Начало отключения по календарю ДТЕК (запасной вариант, если нет истории напряжения): "YYYY-MM-DD HH:MM:SS" местного времени.
function dtekStart(S, nowMs){
  const c = findEntity(S, DTEK_CAL_RE);
  if(!c || c.state!=="on" || !c.attributes) return null;
  const t = Date.parse(String(c.attributes.start_time||"").replace(" ","T"));
  return (Number.isFinite(t) && t <= nowMs) ? t : null;
}
// Запасной источник — график YASNO: берём время только если по графику сейчас идёт отключение, т.е. ближайшее
// включение раньше следующего планового отключения, и YASNO не в аварийном режиме. Иначе — неизвестно.
function plannedRestore(nextConn, nextOut, nowMs, statusToday){
  if(statusToday==="emergency_shutdowns") return null;
  const a = Date.parse(nextConn), b = Date.parse(nextOut);
  if(!Number.isFinite(a) || a <= nowMs) return null;
  if(Number.isFinite(b) && b <= a) return null;
  return a;
}
// ДТЕК приоритетнее YASNO. Результат: {ms, src:"dtek"|"yasno"} или null.
function restoreInfo(S, nowMs){
  const st = (id)=> S[id] ? S[id].state : null;
  const d = dtekRestore(S, nowMs);
  if(d) return {ms:d, src:"dtek"};
  const y = plannedRestore(st(YASNO_NEXT_CONN), st(YASNO_NEXT_OUT), nowMs, st(YASNO_STATUS));
  return y ? {ms:y, src:"yasno"} : null;
}
function fmtWhen(ms, nowMs){
  const d = new Date(ms), n = new Date(nowMs);
  const hm = p2(d.getHours())+":"+p2(d.getMinutes());
  return (d.toDateString()===n.toDateString() ? "" : p2(d.getDate())+"."+p2(d.getMonth()+1)+" ") + "в " + hm;
}
function outageLabel(startMs, restore, nowMs){
  return "СВЕТ ПРОПАЛ" + (startMs ? " "+fmtWhen(startMs, nowMs) : "") + " · ВКЛЮЧЕНИЕ " +
         (restore ? (restore.src==="dtek" ? "ПО ДАННЫМ ДТЕК " : "ПО ГРАФИКУ ")+fmtWhen(restore.ms, nowMs) : "— ВРЕМЯ НЕИЗВЕСТНО");
}
// Подбор размера шрифта подписи: стандартные 28 px, длинную (две даты) уменьшаем до 20 px, чтобы она помещалась в рамку.
function fitFontSize(measure, maxW, start, min){
  let fs = start;
  while(fs > min && measure(fs) > maxW) fs--;
  return fs;
}
// ---- график отключений на день (48 получасовых ячеек): ДТЕК (сенсор dtek_schedule) -> календарь YASNO -> нет ----
const SCHED_RE = /^sensor\.dtek_schedule\w*$/;
const YASNO_CAL = "calendar.yasno_dnipro_dnem_2_2_planned_outages", YASNO_GROUP = "2.2";
const ymd = (d)=> d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
function dtekTable(S, todayStr){
  const e = findEntity(S, SCHED_RE), a = e && e.attributes;
  if(!a || a.date !== todayStr) return null;
  const c = a.cells;
  if(!Array.isArray(c) || c.length!==48 || !c.every(v=> v===0 || v===1 || v===2)) return null;
  const m = String(a.updated||"").match(/(\d{2}\.\d{2})\.\d{4}\s+(\d{2}:\d{2})/), g = String(a.group||"").match(/^GPV(\d+\.\d+)$/);
  return {cells:c.slice(), group:g?g[1]:"", updated:m?m[1]+" "+m[2]:""};
}
function cellsFromEvents(events, dayStartMs){
  const cells = new Array(48).fill(0);
  for(const [s,e] of events) for(let i=0;i<48;i++){ const a = dayStartMs + i*1800000; if(s < a+1800000 && e > a) cells[i] = 1; }
  return cells;
}
function fmtHours(h){
  const w = Math.floor(h), m = Math.round((h-w)*60);
  if(!w && !m) return "0 ч";
  return [w?w+" ч":"", m?m+" мин":""].filter(Boolean).join(" ");
}
function buildSchedule(S, events, nowMs){
  const now = new Date(nowMs), dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const t = dtekTable(S, ymd(now));
  let cells, src, title;
  if(t){ cells = t.cells; src = "dtek"; title = "ГРАФИК ДТЕК"+(t.group?" · очередь "+t.group:"")+(t.updated?" · обновлён "+t.updated:""); }
  else if(events){ cells = cellsFromEvents(events, dayStart); src = "yasno"; title = "ГРАФИК YASNO · очередь "+YASNO_GROUP; }
  else return null;
  const hours = cells.filter(c=>c===1).length*0.5, pos = (nowMs-dayStart)/3600000;
  return {cells, src, title, hasOutage:hours>0, total: hours ? "без света сегодня "+fmtHours(hours) : "сегодня без отключений", now:(pos>=0 && pos<=24) ? pos : null};
}
// Подписи времени начала участков: участок — подряд идущие ячейки одного состояния; подписываем его начало
// (кроме начала суток) и только если участок не короче minCells ячеек (по умолчанию 4 = 2 часа).
function scheduleLabels(cells, minCells){
  const min = minCells || 4, out = [];
  for(let i=0, n=cells.length; i<n; ){
    let j = i; while(j<n && cells[j]===cells[i]) j++;
    if(i>0 && j-i >= min){ const m = i*30; out.push([i, p2(Math.floor(m/60))+":"+p2(m%60)]); }
    i = j;
  }
  return out;
}
let outStart = null, outFetchedAt = 0;
async function updateOutageStart(out){
  if(!out){ outStart = null; outFetchedAt = 0; return; }
  if(outFetchedAt && Date.now() - outFetchedAt < HIST_EVERY_MS) return;
  outFetchedAt = Date.now();
  try{
    // end_time обязателен: без него HA отдаёт только start+1 сутки (а не «до сейчас»)
    const nowMs = Date.now(), since = new Date(nowMs - HIST_HOURS*3600000).toISOString();
    const j = await api("/api/history/period/"+since+"?filter_entity_id="+GRID_VOLT+
                        "&end_time="+encodeURIComponent(new Date(nowMs).toISOString())+"&minimal_response&no_attributes");
    outStart = outageStartFrom((j && j[0]) || [], OUTAGE_BELOW_V);
  }catch(e){ if(outStart === null) outFetchedAt = Date.now() - HIST_EVERY_MS + HIST_RETRY_MS; }
}
function setOutageFrame(out, S){
  document.getElementById("gridwrap").classList.toggle("outage", out);
  const now = Date.now(), span = document.getElementById("outlineText");
  span.textContent = out ? outageLabel(outStart ?? dtekStart(S, now), restoreInfo(S, now), now) : "";
  if(out){   // место: ширина рамки минус отступ слева (26) и запас у правого угла (30)
    const maxW = span.parentElement.clientWidth - 26 - 30;
    span.style.fontSize = fitFontSize((fs)=>{ span.style.fontSize = fs+"px"; return span.offsetWidth; }, maxW, 28, 20) + "px";
  }
}
// DOM полосы: 48 ячеек и засечки создаются один раз, затем обновляются классы
let yasnoEvents = null, yasnoAt = 0, yasnoDay = "";
async function updateYasnoEvents(S){
  const now = new Date(), today = ymd(now);
  if(dtekTable(S, today)) return;                                   // есть таблица ДТЕК — запасной график не нужен
  if(yasnoDay===today && Date.now()-yasnoAt < 900000) return;
  yasnoAt = Date.now(); yasnoDay = today;
  const day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  try{
    const j = await api("/api/calendars/"+YASNO_CAL+"?start="+encodeURIComponent(day.toISOString())+"&end="+encodeURIComponent(new Date(day.getTime()+86400000).toISOString()));
    yasnoEvents = (j||[]).filter(e=>/outage/i.test(e.summary||"") && e.start && e.start.dateTime && e.end && e.end.dateTime)
                         .map(e=>[Date.parse(e.start.dateTime), Date.parse(e.end.dateTime)]).filter(([a,b])=>Number.isFinite(a)&&Number.isFinite(b));
  }catch(e){ yasnoAt = Date.now() - 840000; }                       // повтор через минуту
}
function renderSchedule(s){
  const bar = document.getElementById("schedBar"), title = document.getElementById("schedTitle"), total = document.getElementById("schedTotal");
  if(!bar.children.length){
    for(let i=0;i<48;i++) bar.appendChild(document.createElement("i"));
    const now = document.createElement("div"); now.className = "now"; now.id = "schedNow"; bar.appendChild(now);
  }
  const nowEl = document.getElementById("schedNow");
  bar.querySelectorAll(".tl").forEach(e=>e.remove());
  if(!s){ bar.classList.add("off"); title.textContent = "график отключений недоступен"; total.textContent = ""; total.className = ""; nowEl.style.display = "none"; return; }
  bar.classList.remove("off");
  title.textContent = s.title; total.textContent = s.total; total.className = s.hasOutage ? "out" : "ok";
  for(let i=0;i<48;i++) bar.children[i].className = "c"+s.cells[i] + ((s.now!==null && (i+1)*0.5 <= s.now) ? " past" : "");
  for(const [i, text] of scheduleLabels(s.cells)){
    const l = document.createElement("span"); l.className = "tl"; l.style.left = (i/48*100)+"%"; l.textContent = text; bar.appendChild(l);
  }
  if(s.now===null) nowEl.style.display = "none"; else { nowEl.style.display = "block"; nowEl.style.left = (s.now/24*100)+"%"; }
}
const cap = (s)=> s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

const num = (v,dp=0)=>{ const n=parseFloat(v); return isNaN(n)?"—":n.toLocaleString("ru-RU",{maximumFractionDigits:dp,minimumFractionDigits:dp}); };
const kw  = (w)=>{ const n=parseFloat(w); if(isNaN(n)) return {v:"—",u:""}; return Math.abs(n)>=1000 ? {v:(n/1000).toLocaleString("ru-RU",{maximumFractionDigits:2}),u:"кВт"} : {v:Math.round(n).toLocaleString("ru-RU"),u:"Вт"}; };

// stroke SVG icons (24 viewBox), coloured by the card's accent
const SVG = (b)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICON = {
  // опора ЛЭП
  grid:   SVG('<path d="M4 5h16"/><path d="M12 5v16"/><path d="M7.5 21 9 9M16.5 21 15 9"/><path d="M9 9h6"/><path d="M9.5 14.5h5"/><path d="M7 5l2.2 4M17 5l-2.2 4"/><path d="M2 5h2M20 5h2"/>'),
  // инвертор (прямоугольник с дисплеем и индикатором)
  inv:    SVG('<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M5.5 9.5h7"/><circle cx="17.5" cy="9.5" r="1.2" fill="currentColor"/><path d="M5.5 14 8 14 9.5 11.5 11.5 16.5 13 14 18.5 14"/>'),
  // солнечные панели
  pv:     SVG('<path d="M4 4h16l1.7 10H2.3z"/><path d="M8 4 7 14M16 4l1 10M3 9h18"/><path d="M12 14v6M8 20h8"/>'),
  // батарея
  batt:   SVG('<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21.5 10v4"/><rect x="4.5" y="9.5" width="8" height="5" rx="1" fill="currentColor" stroke="none"/>'),
  // домик (потребление)
  house:  SVG('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10V20h13V10"/><rect x="10" y="14" width="4" height="6"/>'),
  // батарея с молнией (SOC)
  battbolt:SVG('<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M21.5 10v4"/><path d="M11 8.5 8 12.4h3L9.5 15.5"/>'),
  // питание инвертора (блок с кнопкой питания)
  invcbl: SVG('<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M12 8.5v3.5"/><path d="M9 10a4 4 0 1 0 6 0"/>'),
  // пейзаж с деревьями (улица)
  trees:  SVG('<path d="M2 20h20"/><path d="M7 20v-4"/><path d="M3.5 16 7 8.5l3.5 7.5z"/><path d="M16 20v-5"/><path d="M12 15 16 6l4 9z"/>'),
  // полукруглая теплица
  green:  SVG('<path d="M3 20V13a9 6.5 0 0 1 18 0v7"/><path d="M2 20h20"/><path d="M12 6.5V20M7 20v-9.3M17 20v-9.3"/>'),
  // круглый бойлер
  boiler: SVG('<rect x="5.5" y="5" width="13" height="16" rx="6.5"/><path d="M9 5V2.2M15 5V2.2M9 2.2h6"/><circle cx="12" cy="13.5" r="3"/>'),
};

function card(o){
  const kwv = o.kw ? kw(o.raw) : null;
  const head = o.icon ? `<div class="ico" style="color:${o.color||'var(--dim)'}" title="${o.lbl||''}">${ICON[o.icon]||''}</div>`
                      : `<div class="lbl">${o.lbl}</div>`;
  return `<div class="card ${o.stale?'stale':''}">
    <div class="accent" style="background:${o.color||'var(--line)'}"></div>
    ${head}
    <div class="body">
      <div class="val ${o.big?'big':''}">${o.html!==undefined?o.html:(kwv?kwv.v:o.val)} <small>${o.unit!==undefined?o.unit:(kwv?kwv.u:'')}</small></div>
      ${o.bar!==undefined?`<div class="bar"><i style="width:${o.bar}%;background:${o.barColor||o.color}"></i></div>`:''}
      ${o.note?`<div class="note">${o.note}</div>`:''}
    </div>
  </div>`;
}

async function refresh(){
  const err = document.getElementById("err");
  try{
    const arr = await api("/api/states");
    const S = {}; arr.forEach(s=>S[s.entity_id]=s);
    const g = (id)=> S[id] ? S[id].state : null;
    const at = (id,a)=> S[id] && S[id].attributes ? S[id].attributes[a] : null;
    const avail = (id)=> S[id] && !["unavailable","unknown",null,undefined,""].includes(S[id].state);

    // ---- current weather (Кривой Рог) ----
    // sun.sun is authoritative for day/night; the Gismeteo integration sometimes
    // keeps "clear-night" after sunrise.
    const sun = g("sun.sun");
    let wc = g(WEATHER);
    if(sun==="above_horizon" && wc==="clear-night") wc="sunny";
    if(sun==="below_horizon" && wc==="sunny")       wc="clear-night";
    const wTemp = at(WEATHER,"temperature");
    const wHum  = at(WEATHER,"humidity");
    const wWind = at(WEATHER,"wind_speed");
    let wIco = WICON[wc]||"·";
    if(sun==="below_horizon" && wc==="partlycloudy") wIco="🌙☁️";
    document.getElementById("w-ico").textContent  = wIco;
    document.getElementById("w-temp").textContent = (wTemp!=null?Math.round(wTemp):"—")+"°";
    document.getElementById("w-cond").textContent = cap(WNAME[wc]||wc||"—");
    document.getElementById("w-sub").textContent =
      "Кривой Рог" + (wHum!=null?("   влажн. "+Math.round(wHum)+"%"):"") + (wWind!=null?("   ветер "+num(wWind,1)+" м/с"):"");

    // ---- forecast (refreshed at most every 10 min) ----
    if(Date.now() - fcAt > 600000){
      try{
        const fr = await api("/api/services/weather/get_forecasts?return_response",
          {method:"POST",headers:{"Content-Type":"application/json"},
           body:JSON.stringify({entity_id:WEATHER,type:"daily"})});
        const k = Object.keys(fr.service_response||{})[0];
        fcData = (fr.service_response[k].forecast||[]).slice(0,5);
        fcAt = Date.now();
      }catch(e){}
    }
    document.getElementById("fc").innerHTML = fcData.map(f=>{
      const d = new Date(f.datetime);
      const c = f.condition==="clear-night" ? "sunny" : f.condition;
      return `<div class="d">
        <div class="dw">${RU_DOW_S[d.getDay()]}</div>
        <div class="di">${WICON[c]||"·"}</div>
        <div class="dt">${Math.round(f.temperature)}° <small>${Math.round(f.templow)}°</small></div>
      </div>`;
    }).join("");

    // ---- sensor tiles ----
    const battW = parseFloat(g("sensor.jk_bms2_jk_bms2_power"));
    const soc   = parseFloat(g("sensor.jk_bms2_jk_bms2_state_of_charge"));
    const boiler = g("light.hobeian_zg_301z")==="on";
    const breaker = g("switch.ji_liang_duan_lu_qi_switch")==="on";
    const socColor = soc>=60?"var(--on)":soc>=30?"var(--pv)":"var(--batt-out)";
    // JK BMS: value < 0 = разряд (с батареи), > 0 = заряд (на батарею)
    const battCharge = battW > 0;
    const pill = (on,txtOn,txtOff)=>`<span class="pill" style="background:${on?'var(--on)':'var(--panel2)'};color:${on?'#0d1117':'var(--off)'}">${on?txtOn:txtOff}</span>`;

    const out = isOutage(g(GRID_VOLT));
    await updateOutageStart(out);
    setOutageFrame(out, S);
    await updateYasnoEvents(S);
    renderSchedule(buildSchedule(S, yasnoEvents, Date.now()));
    document.getElementById("grid").innerHTML = [
      // --- ряд 1: мощности ---
      card({icon:"grid", lbl:"Мощность из сети", raw:g("sensor.moshchnost_iz_seti"), kw:true, color:"var(--grid)",
            stale:!avail("sensor.moshchnost_iz_seti")}),
      card({icon:"inv", lbl:"Мощность на инвертор", raw:g("sensor.ji_liang_duan_lu_qi_power"), kw:true, color:"var(--grid)",
            stale:!avail("sensor.ji_liang_duan_lu_qi_power")}),
      card({icon:"pv", lbl:"Мощность с панелей", raw:g("sensor.inverter_pv_input_power"), kw:true, color:"var(--pv)",
            stale:!avail("sensor.inverter_pv_input_power")}),
      card({icon:"batt", lbl: isNaN(battW) ? "Мощность батареи" : (battCharge ? "Батарея — заряд" : "Батарея — разряд"),
            html: (isNaN(battW)?"—": (battCharge?"↓ ":"↑ ")+kw(Math.abs(battW)).v),
            unit: isNaN(battW)?"":kw(Math.abs(battW)).u,
            color: battCharge?"var(--batt-in)":"var(--batt-out)",
            stale:!avail("sensor.jk_bms2_jk_bms2_power")}),
      card({icon:"house", lbl:"Мощность потребления", raw:g("sensor.inverter_output_active_power"), kw:true, color:"var(--load)",
            stale:!avail("sensor.inverter_output_active_power")}),

      // --- ряд 2: заряд / питание / температуры / бойлер ---
      card({icon:"battbolt", lbl:"Заряд батареи (SOC)", val:num(soc,0), unit:"%", big:true, color:socColor, barColor:socColor,
            bar: isNaN(soc)?0:Math.max(0,Math.min(100,soc)),
            stale:!avail("sensor.jk_bms2_jk_bms2_state_of_charge")}),
      card({icon:"invcbl", lbl:"Питание инвертора", html:pill(breaker,"ВКЛ","ВЫКЛ"), unit:"",
            color: breaker?"var(--on)":"var(--off)",
            stale:!avail("switch.ji_liang_duan_lu_qi_switch")}),
      card({icon:"trees", lbl:"Температура на улице", val:(wTemp!=null?num(wTemp,1):"—"), unit:"°C",
            color:"var(--cold)", note:"Кривой Рог"+(wHum!=null?(", влажн. "+Math.round(wHum)+"%"):""),
            stale:!avail(WEATHER)}),
      card({icon:"green", lbl:"Температура в теплице", val:num(g("sensor.teplitsa_temperatura"),1), unit:"°C",
            color:"var(--hot)", note:"влажность "+num(g("sensor.temp1_vlazhnost"),0)+"%",
            stale:!avail("sensor.teplitsa_temperatura")}),
      card({icon:"boiler", lbl:"Бойлер 2", html:pill(boiler,"ВКЛ","ВЫКЛ"), unit:"",
            color: boiler?"var(--on)":"var(--off)",
            stale:!avail("light.hobeian_zg_301z")}),
    ].join("");

    err.textContent = "";
  }catch(e){
    err.textContent = "ошибка данных: "+e.message+" · "+new Date().toLocaleTimeString("ru-RU");
  }
}
refresh();
setInterval(refresh, 20000);
</script>
